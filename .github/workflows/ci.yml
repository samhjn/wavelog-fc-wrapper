name: Container checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build with current PHP security fixes
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          platforms: linux/amd64
          tags: wavelog-fc:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Lint wrapper PHP and shell
        run: |
          bash -n docker/entrypoint.sh
          docker run --rm --entrypoint sh wavelog-fc:test -c 'for f in /opt/wavelog-fc/*.php; do php -n -l "$f" || exit; done'
      - name: Install, exercise timer, and recreate the container
        run: python3 tests/smoke.py wavelog-fc:test
