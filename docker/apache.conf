ServerName localhost
ServerTokens Prod
ServerSignature Off
Timeout 920
KeepAlive Off
StartServers 2
MinSpareServers 2
MaxSpareServers 4
MaxRequestWorkers 8
MaxConnectionsPerChild 500

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<Directory /mnt/wavelog>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
<DirectoryMatch "^(?:/mnt/wavelog|/var/www/html)/(application|sessions|locks|backup)(/|$)">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "^(?:/mnt/wavelog|/var/www/html)/(uploads|userdata|assets/qslcard|assets/resources|images/eqsl_card_images|backup|updates)(/|$)">
    AllowOverride None
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<Directory /opt/wavelog-fc>
    AllowOverride None
    Require all granted
</Directory>

<VirtualHost *:9000>
    DocumentRoot /var/www/html
    Alias /healthz /opt/wavelog-fc/health.php
    Alias /invoke /opt/wavelog-fc/invoke.php
    Header always set X-Content-Type-Options nosniff
    ErrorLog /proc/self/fd/2
    # Do not log query parameters or Authorization headers.
    CustomLog /proc/self/fd/1 "%h %t \"%m %U %H\" %>s %b"
</VirtualHost>

# Upstream's Docker Cron Manager calls http://localhost/<job>. Keep port 80
# loopback-only, separate from FC's public listener (9000).
<VirtualHost 127.0.0.1:80>
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%h %t \"%m %U %H\" %>s %b"
</VirtualHost>
