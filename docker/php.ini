variables_order = "EGPCS"
auto_prepend_file = /opt/wavelog-fc/bootstrap.php
date.timezone = UTC
memory_limit = 256M
max_execution_time = 900
max_input_time = 900
file_uploads = On
; Leave room below FC's 32 MB HTTP request-body limit for multipart overhead.
upload_max_filesize = 30M
post_max_size = 31M
session.save_path = /mnt/wavelog/sessions
session.use_strict_mode = 1
session.cookie_httponly = 1
session.upload_progress.enabled = 0
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
opcache.enable = 1
